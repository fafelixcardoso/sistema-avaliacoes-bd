spring.application.name=sistema-avaliacoes
server.port=8080

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/avaliacoes_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Pool de Conexões HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Desativa inicialização automática do Spring (schema e carga gerenciados via SQL)
spring.sql.init.mode=never
